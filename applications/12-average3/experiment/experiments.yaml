application:
  name: 12-average3
  description: "Average of three values test"
  app_type: regression_test

  sources:
    - kernels.cpp

  build:
    extra_linker_args: []
    defines: []


test_naming:
  template: "12-average3-{scheduler}"
  description: "Average3 test naming pattern"

parameters:
  - name: scheduler
    type: str
    label: "Scheduler"
    description: "Task scheduling strategy"
    choices:
      - vf-sequential
      - vf-omp
      - vf-enkits

  - name: delay_pingpong
    type: str
    label: "Delay ping-pong"
    description: "Delayed-feedback zero-copy: 0 (copy) or 1 (alias prev instance)"
    choices:
      - "0"
      - "1"

constraints: []


experiment_sets:

  - name: tests
    description: "Tests with all schedulers"
    parameters:
      scheduler:
        - vf-sequential
        - vf-omp
        - vf-enkits

  - name: delay-pp
    description: "Delayed-feedback zero-copy A/B: pingpong 0 (copy) vs 1 (alias)"
    parameters:
      scheduler:
        - vf-sequential
        - vf-omp
        - vf-enkits
      delay_pingpong:
        - "0"
        - "1"

execution:
  repetitions: 1
  timeout: 60
  description: "Single run, 60 second timeout per test"

csv_output:
  columns:
    - scheduler
  description: "Scheduler used"
