application:
  name: "18-sift-photo"
  description: "SIFT on 4K photo (3840x2160) — IaRa vf-omp vs Preesm"
  app_type: experiment
  preesm:
    project_path: "${IARA_DIR}/../preesm-apps/SIFT"
    project_name: "SIFTapp"
    workflow: "Codegen.workflow"
    pi_basename: "Hextract"
    # Parallelism must track NUM_CORES (graph workers >= cores), else the
    # baseline stays at the .pi default parallelism and does not scale.
    parallelism_level_param: "parallelismLevel"
    # 4K image: override the .pi's 800x640 + nKeypointsMaxUser=1400 defaults
    # (injected into the generated scenario's <parameterValues>).
    parameter_values:
      image_width: 3840
      image_height: 2160
      nKeypointsMaxUser: 22680
    # SiftKpt is a 556-byte C struct; stock Preesm sizes unknown FIFO types as
    # 8 bits, under-allocating every keypoint buffer 556x (MERGE segfault).
    data_type_sizes:
      SiftKpt: 4448
    extra_setup:
      - "ln -sfn data ${IARA_DIR}/applications/18-sift-photo/dat"
  build:
    extra_linker_args: ["-lm"]
    main_actor: "Hextract"
    defines: ["VERBOSE=1", "IARA_DATA_TRIGGERED_ALLOC"]

parameters:
  - name: NUM_CORES
    type: int
    label: "CPU cores"
    description: "Number of OpenMP threads / Preesm cores"
    choices: [1, 2, 3, 4, 5, 6, 8, 9, 10, 12, 15, 16, 18, 20]
  - name: scheduler
    type: str
    label: "Scheduler"
    description: "IaRa runtime scheduler or Preesm baseline"
    choices: ["vf-omp", "vf-enkits", "vf-sequential", "preesm"]
  - name: VIDEO_FRAMES
    type: int
    label: "Video frames"
    description: "Number of pipeline iterations per run (1 = single shot, >1 = warm-up test, vf-omp only for >1)"
    choices: [1, 10, 50, 100]

  # IaRa semaphore implementation (iara-opt codegen dim, forwarded as IARA_SEMAPHORE)
  - name: semaphore
    type: str
    label: "Semaphore"
    description: "IaRa semaphore implementation (atomic-ring, sharded-hash, global-mutex)"

  # IaRa VirtualFIFO alloc mode (iara-opt codegen dim, forwarded as IARA_ALLOC_MODE)
  - name: alloc_mode
    type: str
    label: "Alloc mode"
    description: "VirtualFIFO alloc mode (data-triggered or priming)"

  # Broadcast fan-out ownership (iara-opt codegen dim, forwarded as IARA_BROADCAST_OWNERSHIP)
  - name: broadcast_ownership
    type: str
    label: "Broadcast ownership"
    description: "Fan-out strategy: copy-all-but-one (default) or join-owns-buffer (zero-copy RO borrow)"

  # malloc implementation (build-time link flag, forwarded as IARA_MALLOC)
  - name: malloc
    type: str
    label: "Malloc impl"
    description: "malloc/free backend: jemalloc (default) or glibc (opt-out, IARA_MALLOC=glibc)"

  # Delayed-feedback zero-copy (iara-opt codegen dim, forwarded as IARA_DELAY_PINGPONG)
  - name: delay_pingpong
    type: str
    label: "Delay ping-pong"
    description: "Delayed-feedback zero-copy: 0 (copy, default) or 1 (alias prev instance)"

constraints:
  - expression: "VIDEO_FRAMES == 1 or scheduler in ('vf-omp', 'vf-enkits')"
    description: "Multi-frame video warm-up supported for IaRa VirtualFIFO backends (vf-omp/vf-enkits); preesm runs single-frame"

experiment_sets:
  # Zero-copy RO-broadcast RSS A/B: copy-all-but-one vs join-owns-buffer on
  # 4K, vf-omp. Expect max_rss's per-core term (RSS = 2.80*P + 0.92 GB) to
  # collapse under join-owns-buffer (readers alias one buffer, no P* copies).
  - name: borrow-rss
    description: "RO-broadcast ownership A/B: 4K vf-omp, RSS slope vs cores"
    parameters:
      NUM_CORES: [1, 4, 8, 16]
      scheduler: [vf-omp]
      VIDEO_FRAMES: [1]
      broadcast_ownership: [copy-all-but-one, join-owns-buffer]

  # Delay-pingpong A/B on 4K photo. Correctness gate = keypoints (18575 at 8c).
  - name: delay-pp
    description: "Delayed-feedback zero-copy A/B on vf-enkits: pingpong 0 vs 1"
    parameters:
      NUM_CORES: [1, 8]
      scheduler: [vf-enkits]
      VIDEO_FRAMES: [1]
      delay_pingpong: ["0", "1"]

  # Backend comparison on the same workload/params: libomp tasks vs EnkiTS
  # tasks (+ our global TaskSet vector/mutex behind iara_submit_task).
  - name: backend-cmp
    description: "vf-omp vs vf-enkits backend comparison: 1/8 cores, copy path"
    parameters:
      NUM_CORES: [1, 8]
      scheduler: [vf-omp, vf-enkits]
      VIDEO_FRAMES: [1]
      delay_pingpong: ["0"]

  # Timing-only control: IARA_MOCK_ALLOC reserves one arena and aliases >1MB
  # buffers, so per-firing mmap/munmap + first-touch faults disappear. Data is
  # garbage -> keypoints are meaningless here; only wall/sys/faults are read.
  # Timing-only control: IARA_MOCK_ALLOC reserves one arena and aliases >1MB
  # buffers, so per-firing mmap/munmap + first-touch faults disappear. Data is
  # garbage -> keypoints are meaningless here; only wall/sys/faults are read.
  - name: mockcmp
    description: "vf-enkits with IARA_MOCK_ALLOC (timing-only): allocation cost A/B"
    defines:
      - "IARA_MOCK_ALLOC"
    parameters:
      NUM_CORES: [8]
      scheduler: [vf-enkits]
      VIDEO_FRAMES: [1]
      delay_pingpong: ["0"]

  # Theory test: the delay seed memcpy reads the 178 MB static blob. Zero it
  # instead (IARA_DELAYS_ZERO_INIT) -> no read of the blob, FIFO semantics kept
  # (tokens are still pushed, just zero). Timing-only: keypoints are expected to
  # change, since SIFT delays carry real init values.
  - name: zerodelay
    description: "vf-enkits with IARA_DELAYS_ZERO_INIT: delay-seed copy cost A/B"
    defines:
      - "IARA_DELAYS_ZERO_INIT"
    parameters:
      NUM_CORES: [8]
      scheduler: [vf-enkits]
      VIDEO_FRAMES: [1]
      delay_pingpong: ["0"]

  # Strongest form of the same test: no memcpy AND no memset. The delay bytes
  # stay whatever the allocator returned. Dataflow still runs on garbage;
  # timing-only (keypoints meaningless).
  - name: noinit
    description: "vf-enkits with IARA_DELAYS_NO_INIT: no delay seed write at all"
    defines:
      - "IARA_DELAYS_NO_INIT"
    parameters:
      NUM_CORES: [8]
      scheduler: [vf-enkits]
      VIDEO_FRAMES: [1]
      delay_pingpong: ["0"]

  # Single-threaded reference: same P=8 topology as the parallel arms, executed
  # serially with no task scheduler. Isolates the runtime's own cost (alloc, FIFO,
  # purge) from scheduling/concurrency.
  - name: seq
    description: "vf-sequential, P=8 topology executed serially"
    parameters:
      NUM_CORES: [8]
      scheduler: [vf-sequential]
      VIDEO_FRAMES: [1]
      delay_pingpong: ["0"]

  # ---- RO-borrow battery: Preesm baseline vs vf-enkits with/without RO-borrow ----
  # 4K photo, cores 1/4/8/12/16/20. Three arms: preesm (dataflow compiler
  # baseline), vf-enkits + join-owns-buffer (RO zero-copy borrow), vf-enkits +
  # copy-all-but-one (no borrow, physical copies). data-triggered alloc.
  - name: ro-battery
    description: "RO-borrow battery: Preesm baseline vs vf-enkits with/without RO-borrow; 4K, cores 1/4/8/12/16/20"
    parameters:
      NUM_CORES: [1, 4, 8, 12, 16, 20]
      VIDEO_FRAMES: [1]
    matrix:
      scheduler: [vf-enkits]
      broadcast_ownership: [copy-all-but-one, join-owns-buffer]
      alloc_mode: [data-triggered]
    include:
      - {scheduler: preesm}

  - name: photo
    description: "4K photo, all valid parallelism levels, single frame"
    parameters:
      NUM_CORES: [1, 2, 3, 4, 5, 6, 8, 9, 10, 12, 15, 16, 18, 20]
      scheduler: [vf-omp, preesm]
      VIDEO_FRAMES: [1]
    scheduler_override:
      preesm: [preesm]
      vf-omp: [vf-omp]

  - name: quick
    description: "Edge cases only — min/max cores, all schedulers"
    parameters:
      NUM_CORES: [1, 4, 20]
      scheduler: [vf-omp, vf-enkits, vf-sequential, preesm]
      VIDEO_FRAMES: [1]
    scheduler_override:
      preesm: [preesm]
      vf-omp: [vf-omp]
      vf-enkits: [vf-enkits]
      vf-sequential: [vf-sequential]

  - name: video
    description: "Video warm-up test — 1 core, vf-omp multi-frame pipeline loop"
    parameters:
      NUM_CORES: [1]
      scheduler: [vf-omp]
      VIDEO_FRAMES: [1, 10, 50, 100]
    scheduler_override:
      vf-omp: [vf-omp]

  # ---- Overnight large comparison: 4K video steady-state, 4 IaRa + preesm ----
  # 4 IaRa = {vf-omp,vf-enkits} × {atomic-ring,sharded-hash} (data-triggered; priming deprecated)
  # NOTE: intended as 10-frame video (steady state), but IaRa multi-frame segfaults in
  # read_pgm on frame 2 (source-actor buffer freed by data-triggered window before frame 2
  # re-fires) — all 4 variants, ~4GB (not OOM). Falling back to single-frame (VIDEO_FRAMES=1),
  # which works (~1400 kp). preesm is single-frame regardless.
  - name: large-sub-sched
    description: "4K single-frame: 4 IaRa versions (frames=1) + preesm; cores{1,4,8,12,16,20}"
    parameters:
      NUM_CORES: [1, 4, 8, 12, 16, 20]
    matrix:
      scheduler: [vf-omp, vf-enkits]
      semaphore: [atomic-ring, sharded-hash]
      alloc_mode: [data-triggered]
      VIDEO_FRAMES: [1]
    include:
      - {scheduler: preesm, VIDEO_FRAMES: 1}

  # ---- Scaling comparison: IaRa copy vs borrow vs Preesm across cores ----
  # Does the zero-copy RO-broadcast borrow stop the anti-scaling, and how does it
  # scale vs Preesm? vf-omp data-triggered atomic-ring, both ownership arms +
  # Preesm, 4K single-frame. copy = old anti-scaling reference, borrow = new,
  # preesm = scaling target. (IaRa may fail to link at high core counts due to
  # the known large-BSS issue; those instances just fail to build.)
  - name: borrow-vs-preesm
    description: "4K 1-frame scaling: IaRa vf-omp copy vs join-owns-buffer vs Preesm; cores{1,4,8,12,16,20}"
    parameters:
      NUM_CORES: [1, 4, 8, 12, 16, 20]
    matrix:
      scheduler: [vf-omp]
      semaphore: [atomic-ring]
      alloc_mode: [data-triggered]
      VIDEO_FRAMES: [1]
      broadcast_ownership: [copy-all-but-one, join-owns-buffer]
    include:
      - {scheduler: preesm, VIDEO_FRAMES: 1}

  # ---- Backend A/B: vf-omp vs vf-enkits at 8 cores (task-runtime overhead) ----
  # perf showed vf-omp spends ~41% of wall in libomp task scheduling; enkits is a
  # lighter work-stealing backend. Same borrow/alloc/sema, single 4K frame.
  - name: enkits-ab
    description: "8-core borrow: vf-omp vs vf-enkits (task-runtime overhead A/B)"
    parameters:
      NUM_CORES: [8]
    matrix:
      scheduler: [vf-omp, vf-enkits]
      semaphore: [atomic-ring]
      alloc_mode: [data-triggered]
      VIDEO_FRAMES: [1]
      broadcast_ownership: [join-owns-buffer]

  # ---- Core sweep, valid admissibility counts only ----
  # SDF graph admissibility restricts PARALLELISM_LEVEL to divisors of the
  # smallest-octave grd/rot size (= tot_image_size*4^(2-nOctaves) = 32400 for
  # 4K); all other core counts fail at build.
  # vf-enkits (zero-copy RO borrow) + Preesm, 3 measured runs each.
  - name: sweep
    description: "Core sweep (valid counts): vf-enkits + Preesm, 3 runs"
    matrix:
      include:
        - scheduler: vf-enkits
          broadcast_ownership: join-owns-buffer
          VIDEO_FRAMES: 1
          NUM_CORES: [1, 2, 3, 4, 5, 6, 8, 9, 10, 12, 15, 16, 18, 20, 24, 25, 27, 30]
        - scheduler: preesm
          VIDEO_FRAMES: 1
          NUM_CORES: [1, 2, 3, 4, 5, 6, 8, 9, 10, 12, 15, 16, 18, 20, 24, 25, 27, 30]

  # ---- RERUN-SWEEP: paper-config sweep, single node, cores 1/2/4/8, 5 runs ----
  # Same arms as `sweep` (vf-enkits RO-borrow vs preesm) but only counts that
  # build today (preesm OOMs/timeouts >= 9 cores) and 5 measured runs each.
  # Run all instances on ONE Slurm node to control node variance.
  - name: rerun-sweep
    description: "Core sweep (valid counts): vf-enkits + Preesm, 5 runs, single node"
    matrix:
      include:
        - scheduler: vf-enkits
          broadcast_ownership: join-owns-buffer
          VIDEO_FRAMES: 1
          NUM_CORES: [1, 2, 4, 8]
        - scheduler: preesm
          VIDEO_FRAMES: 1
          NUM_CORES: [1, 2, 4, 8]

  # ---- PROFILE8: minimal pair for perf diff (preesm vs vf-enkits borrow, 8 cores) ----
  - name: profile8
    description: "Profile pair: preesm vs vf-enkits (RO borrow), 8 cores, 1 frame"
    matrix:
      include:
        - scheduler: vf-enkits
          broadcast_ownership: join-owns-buffer
          alloc_mode: data-triggered
          semaphore: atomic-ring
          VIDEO_FRAMES: 1
          NUM_CORES: 8
        - scheduler: preesm
          VIDEO_FRAMES: 1
          NUM_CORES: 8

  # ---- PROFILE8-MALLOC: vf-enkits malloc A/B (glibc vs jemalloc) + preesm ----
  - name: profile8-malloc
    description: "Profile pair: preesm vs vf-enkits (RO borrow), 8 cores, jemalloc on/off"
    matrix:
      include:
        - scheduler: vf-enkits
          broadcast_ownership: join-owns-buffer
          alloc_mode: data-triggered
          semaphore: atomic-ring
          malloc: glibc
          VIDEO_FRAMES: 1
          NUM_CORES: 8
        - scheduler: vf-enkits
          broadcast_ownership: join-owns-buffer
          alloc_mode: data-triggered
          semaphore: atomic-ring
          malloc: jemalloc
          VIDEO_FRAMES: 1
          NUM_CORES: 8
        - scheduler: preesm
          VIDEO_FRAMES: 1
          NUM_CORES: 8

  # ---- BATTERY: comprehensive backend/baseline comparison (4K, 1 frame) ----
  # IaRa vf-omp + vf-enkits (join-owns-buffer borrow, data-triggered, atomic-ring)
  # vs Preesm, across cores. All IaRa runs use the new zero-copy RO-broadcast
  # borrow; enkits now honors OMP_NUM_THREADS (fair core count).
  - name: battery
    description: "Battery: IaRa vf-omp/vf-enkits (borrow) vs Preesm; 4K, cores 1/4/8"
    parameters:
      NUM_CORES: [1, 4, 8]
    matrix:
      scheduler: [vf-omp, vf-enkits]
      semaphore: [atomic-ring]
      alloc_mode: [data-triggered]
      VIDEO_FRAMES: [1]
      broadcast_ownership: [join-owns-buffer]
      malloc: [glibc, jemalloc]
    include:
      - {scheduler: preesm, VIDEO_FRAMES: 1}

  # ---- Paper: RO-broadcast ownership A/B x both backends + Preesm (4K, latest git) ----
  # Missing graph data (Fig 4/5/7/9 + ownership ablation): copy-all-but-one (before)
  # vs join-owns-buffer (after) for BOTH backends across cores, plus Preesm baseline.
  # 4K single frame, data-triggered, atomic-ring. Core counts follow the recent
  # ro-battery/battery runs {1,4,8,12,16,20}.
  - name: paper-ownership
    description: "Paper: ownership A/B x {vf-omp,vf-enkits} + Preesm; 4K, cores 1/4/8/12/16/20"
    parameters:
      NUM_CORES: [1, 4, 8, 12, 16, 20]
    matrix:
      scheduler: [vf-omp, vf-enkits]
      broadcast_ownership: [copy-all-but-one, join-owns-buffer]
      alloc_mode: [data-triggered]
      semaphore: [atomic-ring]
      VIDEO_FRAMES: [1]
    include:
      - {scheduler: preesm, VIDEO_FRAMES: 1}

measurements:
  - name: keypoints_found
    type: int
    description: "Number of SIFT keypoints detected"
    parser:
      type: regex
      pattern: "Keypoints found:\\s+(\\d+)"
      group: 1
    required: false
  - name: frame_1_time_ms
    type: float
    description: "Wall time of first frame in ms (VIDEO_FRAMES > 1 only)"
    parser:
      type: regex
      pattern: "Frame 1:\\s+([0-9.]+)\\s*ms"
      group: 1
    required: false
  - name: frame_steady_time_ms
    type: float
    description: "Average wall time of last half of frames in ms"
    parser:
      type: regex
      pattern: "Steady-state avg:\\s+([0-9.]+)\\s*ms"
      group: 1
    required: false

execution:
  repetitions: 5
  warmup: 2
  timeout: 3600
  # Preesm build timeout at a core count → skip larger preesm core counts
  # (recorded as failure_mode=skipped data points). Timeout only: fast
  # build-errors/OOMs are kept as informative failures.
  skip_larger:
    schedulers: [preesm]
    modes: [build-timeout]
  environment:
    OMP_NUM_THREADS: "{NUM_CORES}"
    OMP_PROC_BIND: "close"
    OMP_PLACES: "cores"

visualization:
  plots:
    # Default plots (wall_time, max_rss, compilation_time, binary_size,
    # binary_size_no_bss) are auto-generated and need NOT be listed here.
    # Only add custom plots below that extend beyond the universals.
    warmup_ratio:
      title: "SIFT 4K — Frame 1 vs Steady-state (Warm-up)"
      type: grouped_bars
      y_axis:
        metric: frame_1_time_ms
        title: "Frame 1 Time (ms)"
      x_axis:
        VIDEO_FRAMES: group
