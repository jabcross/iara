application:
  name: 22-ro-broadcast
  description: "All-read-only broadcast zero-copy borrow (FirstKeepsBuffer strategy)"
  app_type: regression_test

  sources:
    - kernels.cpp

  build:
    extra_linker_args: []
    defines: []


test_naming:
  template: "22-ro-broadcast-{scheduler}-{alloc_mode}-{broadcast_ownership}"
  description: "RO-broadcast test naming pattern"

parameters:
  - name: scheduler
    type: str
    label: "Scheduler"
    description: "Task scheduling strategy"
    choices:
      - vf-sequential
      - vf-omp
      - vf-enkits
  - name: alloc_mode
    type: str
    label: "Alloc mode"
    description: "VirtualFIFO alloc mode (data-triggered or priming)"
  - name: broadcast_ownership
    type: str
    label: "Broadcast ownership"
    description: "Broadcast fan-out strategy (copy-all-but-one or join-owns-buffer)"
    choices:
      - copy-all-but-one
      - join-owns-buffer

constraints: []


experiment_sets:

  - name: tests
    description: "All schedulers x both alloc modes x both ownership strategies.
      Oracle asserts 0 mistakes always; reuse count keys on the compiler's
      effective borrow decision (IARA_BROADCAST_BORROW). borrow ON only under
      data-triggered+join-owns-buffer (=> 3 reuses); every other combo takes the
      copy path (=> 1 reuse), which must still run correctly."
    parameters:
      scheduler:
        - vf-sequential
        - vf-omp
        - vf-enkits
      alloc_mode:
        - priming
        - data-triggered
      broadcast_ownership:
        - join-owns-buffer
        - copy-all-but-one

execution:
  repetitions: 1
  timeout: 60
  description: "Single run, 60 second timeout per test"

csv_output:
  columns:
    - scheduler
    - alloc_mode
    - broadcast_ownership
  description: "Scheduler + alloc mode + broadcast ownership strategy used"
