application:
  name: 30-param-dyn-fanout
  description: "Param-sized dynamic fan-out through hierarchical sub-graph (placeholder broadcast path)"
  app_type: regression_test

  sources:
    - kernels.cpp

  build:
    extra_linker_args: []
    defines: []


test_naming:
  template: "30-param-dyn-fanout-{scheduler}"
  description: "Param-dyn-fanout test naming pattern"

parameters:
  - name: scheduler
    type: str
    label: "Scheduler"
    description: "Task scheduling strategy"
    choices:
      - vf-sequential
      - vf-omp
      - vf-enkits

constraints: []


experiment_sets:

  - name: tests
    description: "All VirtualFIFO schedulers; n=4 sizes the producer, the fan-out broadcast's placeholder output resolves to tensor<4xi32> through the hierarchical @sink consumer."
    parameters:
      scheduler:
        - vf-sequential
        - vf-omp
        - vf-enkits

execution:
  repetitions: 1
  timeout: 60
  description: "Single run, 60 second timeout per test"

csv_output:
  columns:
    - scheduler
  description: "Scheduler used"
