application:
  name: 23-ro-broadcast-multirate
  description: "Multi-rate all-read-only broadcast zero-copy borrow (replication / toroidal wrap)"
  app_type: regression_test

  sources:
    - kernels.cpp

  build:
    extra_linker_args: []
    defines: []


test_naming:
  template: "23-ro-broadcast-multirate-{scheduler}-{alloc_mode}-{broadcast_ownership}"
  description: "Multi-rate RO-broadcast test naming pattern"

parameters:
  - name: scheduler
    type: str
    label: "Scheduler"
    description: "Task scheduling strategy"
    choices:
      - vf-sequential
      - vf-omp
      - vf-enkits
  - name: alloc_mode
    type: str
    label: "Alloc mode"
    description: "VirtualFIFO alloc mode (data-triggered or priming)"
  - name: broadcast_ownership
    type: str
    label: "Broadcast ownership"
    description: "Broadcast fan-out strategy (copy-all-but-one or join-owns-buffer)"
    choices:
      - copy-all-but-one
      - join-owns-buffer

constraints: []


experiment_sets:

  - name: tests
    description: "All schedulers x both alloc modes, zero-copy borrow strategy"
    parameters:
      scheduler:
        - vf-sequential
        - vf-omp
        - vf-enkits
      alloc_mode:
        - priming
        - data-triggered
      broadcast_ownership:
        - join-owns-buffer

execution:
  repetitions: 1
  timeout: 60
  description: "Single run, 60 second timeout per test"

csv_output:
  columns:
    - scheduler
    - alloc_mode
    - broadcast_ownership
  description: "Scheduler + alloc mode + broadcast ownership strategy used"
