application:
  name: 21-logic-dep
  description: "Logic (control-only, none-typed) edge — gates firing with no data buffer"
  app_type: regression_test

  sources:
    - kernels.cpp

  build:
    extra_linker_args: []
    defines: []


test_naming:
  template: "21-logic-dep-{scheduler}"
  description: "Logic-dependency test naming pattern"

parameters:
  - name: scheduler
    type: str
    label: "Scheduler"
    description: "Task scheduling strategy"
    choices:
      - vf-sequential
      - vf-omp
      - vf-enkits
  # IaRa VirtualFIFO alloc mode (iara-opt codegen dim, forwarded as IARA_ALLOC_MODE)
  - name: alloc_mode
    type: str
    label: "Alloc mode"
    description: "VirtualFIFO alloc mode (data-triggered or priming)"

constraints: []


experiment_sets:

  # Both alloc modes: priming folds logic tokens into arg_bytes; data-triggered
  # recomputes the threshold from trueInputBytes() and must add logic_in_bytes
  # back — this set is what proves logic-edge gating works data-triggered.
  - name: tests
    description: "Tests with all schedulers x both alloc modes"
    parameters:
      scheduler:
        - vf-sequential
        - vf-omp
        - vf-enkits
      alloc_mode:
        - priming
        - data-triggered

execution:
  repetitions: 1
  timeout: 60
  description: "Single run, 60 second timeout per test"

csv_output:
  columns:
    - scheduler
    - alloc_mode
  description: "Scheduler + alloc mode used"
