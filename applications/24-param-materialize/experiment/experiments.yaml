application:
  name: 24-param-materialize
  description: "Compile-time parameter materialization (block-arg param -> kernel arg)"
  app_type: regression_test

  sources:
    - kernels.cpp

  build:
    extra_linker_args: []
    defines: []


test_naming:
  template: "24-param-materialize-{scheduler}"
  description: "Param-materialize test naming pattern"

parameters:
  - name: scheduler
    type: str
    label: "Scheduler"
    description: "Task scheduling strategy"
    choices:
      - vf-sequential
      - vf-omp
      - vf-enkits

constraints: []


experiment_sets:

  - name: tests
    description: "All VirtualFIFO schedulers; param n=42 must reach the kernel."
    parameters:
      scheduler:
        - vf-sequential
        - vf-omp
        - vf-enkits

execution:
  repetitions: 1
  timeout: 60
  description: "Single run, 60 second timeout per test"

csv_output:
  columns:
    - scheduler
  description: "Scheduler used"
